# Ragnaross static site (Astro build output)
# Installed by deploy/setup-host.sh → /etc/nginx/sites-available/ragnaross

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # HTTPS for Cloudflare Tunnel → origin (Full (strict)), using a Cloudflare Origin Certificate.
    # The cert/key are installed by hand and are not in git; nginx -t fails without them.
    listen 443 ssl;

    server_name ragnaross.co.uk www.ragnaross.co.uk;

    ssl_certificate /etc/ssl/certs/cloudflaressl.pem;
    ssl_certificate_key /etc/ssl/private/cloudflaressl.key;

    root /var/www/site/ragnaross/site/dist;
    index index.html;

    # Media lives outside git and the build (uploaded via dufs, see README).
    # ^~ stops the image regex below from catching these and looking in dist/.
    # No "immutable": files can be replaced in place under the same name.
    location ^~ /assets/ {
        alias /var/www/media/ragnaross/assets/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Astro static output (trailingSlash: ignore)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/ragnaross.access.log;
    error_log /var/log/nginx/ragnaross.error.log;
}
