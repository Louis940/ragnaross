# Ragnaross static site (Astro build output)
# Installed by deploy/setup-host.sh → /etc/nginx/sites-available/ragnaross

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name ragnaross.co.uk www.ragnaross.co.uk;

    root /var/www/site/ragnaross/site/dist;
    index index.html;

    # Astro static output (trailingSlash: ignore)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/ragnaross.access.log;
    error_log /var/log/nginx/ragnaross.error.log;
}
